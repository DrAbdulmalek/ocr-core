name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[preprocess,benchmarks,golden]" pytest
      - name: Run tests
        run: pytest -q

  ui-import:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional UI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui-dev]" pytest
      - name: Verify UI import and interaction
        run: pytest -q tests/test_ui_models.py tests/test_ui_import_optional.py tests/test_ui_widget.py
