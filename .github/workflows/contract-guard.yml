name: Contract Guard

# بوابة العقد (issue #73): أي PR يمس سطح عقد OCRResult يجب أن يرفع
# الإصدار الرئيسي، واختبارات البصمات الذهبية تبقى خضراء.
on:
  pull_request:
    paths:
      - "src/ocr_core/schemas/**"
      - "src/ocr_core/engines/base.py"
      - "docs/CONTRACT.md"
      - "tests/test_contract.py"
      - "tests/golden_contract_signature.json"

permissions:
  contents: read

jobs:
  contract-tests:
    name: Golden contract signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Run contract tests
        run: pytest -q tests/test_contract.py

  major-bump-guard:
    name: Contract touch requires major bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Enforce major bump on contract changes
        run: python scripts/ci/contract_guard.py --base "${{ github.event.pull_request.base.sha }}"
