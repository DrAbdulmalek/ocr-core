name: Secret Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-gate:
    name: Scan PR diff for credential-like material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff "$BASE" "$HEAD" > pr.diff

      - name: Run secret gate (redacted output)
        run: python scripts/scan_diff_secrets.py pr.diff
